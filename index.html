<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div id="winner-container">
            <p id="win-text">Winner :</p>
            <p id="winner">X</p>
        </div>
    </header>

    <main>

        <section class="section">

            <div id="parent-container">

                    <p class="blocks" id="1">O</p>
                    
                    <p class="blocks" id="2">X</p>

                    <p class="blocks" id="3">O</p>

                    <p class="blocks" id="4">X</p>

                    <p class="blocks" id="5">O</p>

                    <p class="blocks" id="6">X</p>

                    <p class="blocks" id="7">O</p>

                    <p class="blocks" id="8">X</p>

                    <p class="blocks" id="9">O</p>
                
            </div>

        </section>

    </main>

    <footer>
        <button id="new-game">New Game</button>
        <button id="reset">Reset</button>
    </footer>
</body>
</html>
