<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="icon" type="image/jpg" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div id="winner-container">
            <p id="win-text">Winner :</p>
            <p id="winner"></p>
        </div>
    </header>

    <main>

        <section class="section">

            <div id="parent-container">

                    <p class="blocks" id="1"></p>
                    
                    <p class="blocks" id="2"></p>

                    <p class="blocks" id="3"></p>

                    <p class="blocks" id="4"></p>

                    <p class="blocks" id="5"></p>

                    <p class="blocks" id="6"></p>

                    <p class="blocks" id="7"></p>

                    <p class="blocks" id="8"></p>

                    <p class="blocks" id="9"></p>
                
            </div>

        </section>

    </main>

    <footer>
        <button id="reset">Reset</button>
    </footer>
</body>
</html>
